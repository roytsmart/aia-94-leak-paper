name: tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build and check the article
    steps:
      - uses: actions/checkout@v7
      # TeX Live is installed from CTAN with only the packages the article
      # uses, listed in `.github/texlive.txt`, and the installation is cached
      # on a hash of that list. A run that restores it downloads nothing, so it
      # no longer waits on a slow mirror of Ubuntu, as `apt-get` did for over
      # an hour at times. The cache is saved as soon as TeX Live is installed,
      # so that a run whose tests fail still keeps it.
      - name: Restore TeX Live
        id: texlive
        uses: actions/cache/restore@v6
        with:
          path: ~/texlive
          key: texlive-${{ runner.os }}-${{ hashFiles('.github/texlive.txt') }}
      - name: Install TeX Live
        if: steps.texlive.outputs.cache-hit != 'true'
        # a stuck mirror fails the step rather than holding the runner
        timeout-minutes: 20
        run: |
          curl -fsSL --retry 3 \
            https://mirror.ctan.org/systems/texlive/tlnet/install-tl-unx.tar.gz \
            | tar -xz -C "$RUNNER_TEMP"
          cat > "$RUNNER_TEMP/texlive.profile" <<EOF
          selected_scheme scheme-infraonly
          TEXDIR $HOME/texlive
          TEXMFLOCAL $HOME/texlive/texmf-local
          TEXMFSYSCONFIG $HOME/texlive/texmf-config
          TEXMFSYSVAR $HOME/texlive/texmf-var
          TEXMFHOME ~/texmf
          instopt_adjustpath 0
          tlpdbopt_autobackup 0
          tlpdbopt_install_docfiles 0
          tlpdbopt_install_srcfiles 0
          EOF
          "$RUNNER_TEMP"/install-tl-*/install-tl --profile "$RUNNER_TEMP/texlive.profile"
          "$HOME/texlive/bin/x86_64-linux/tlmgr" install $(sed 's/#.*//' .github/texlive.txt)
      - name: Save TeX Live
        if: steps.texlive.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/texlive
          key: ${{ steps.texlive.outputs.cache-primary-key }}
      - name: Put TeX Live on the path
        run: echo "$HOME/texlive/bin/x86_64-linux" >> "$GITHUB_PATH"
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .[test]
      # The archives (a few hundred megabytes of eclipses, about a hundred of
      # the six channels for the DEMs, a few tens of noise and of the images
      # without a focal-plane filter, a few of the noise through each
      # focal-plane filter) are downloaded from
      # releases of this repository and checked against the digests in the
      # `_archive.py` modules, so a new version of any is a new key.
      - name: Restore the archives
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/aia_94_leak_paper/dems-v*
            ~/.cache/aia_94_leak_paper/eclipses-v*
            ~/.cache/aia_94_leak_paper/entrance-v*
            ~/.cache/aia_94_leak_paper/filters-v*
            ~/.cache/aia_94_leak_paper/noise-v*
          key: archives-${{ hashFiles('aia_94_leak_paper/*/_archive.py') }}
      # The fits of the leak in each eclipse, and the DEMs of each day, take a
      # few minutes each in all. `joblib` keys them on a digest of their model
      # and on the version of their archive, so an older cache is safe to
      # restore: whatever it no longer answers is computed again.
      - name: Restore the fits of the leak and the DEMs
        uses: actions/cache@v6
        with:
          path: ~/.cache/aia_94_leak_paper/joblib
          key: fits-${{ hashFiles('aia_94_leak_paper/eclipses/*.py', 'aia_94_leak_paper/dems/*.py') }}
          restore-keys: |
            fits-
      - name: Test with pytest
        run: pytest
      - name: Upload the article
        uses: actions/upload-artifact@v7
        with:
          name: article
          path: aia_94_leak_paper/aia-94-leak.pdf
          if-no-files-found: error
