name: tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build and check the article
    steps:
      - name: Install LaTeX
        # `apt-get` waits forever if another process on the runner holds the
        # dpkg lock, so bound that wait and answer its prompts non-interactively.
        # The index the runner ships with goes stale, and installing against a
        # stale one asks the mirror for versions it has since replaced.
        run: >-
          sudo apt-get update -o DPkg::Lock::Timeout=300 &&
          sudo apt-get install -y -o DPkg::Lock::Timeout=300
          texlive-publishers texlive-science cm-super latexmk dvipng
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .[test]
      # The archives (a few hundred megabytes of eclipses, a few tens of noise)
      # are downloaded from releases of this repository and checked against
      # the digests in the `_archive.py` modules, so a new version of either
      # is a new key.
      - name: Restore the archives
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/aia_94_leak_paper/eclipses-v*
            ~/.cache/aia_94_leak_paper/noise-v*
          key: archives-${{ hashFiles('aia_94_leak_paper/*/_archive.py') }}
      # The fits of the leak in each eclipse take a few minutes in all. `joblib`
      # keys them on a digest of the model and on the version of the archive,
      # so an older cache is safe to restore: whatever it no longer answers is
      # computed again.
      - name: Restore the fits of the leak
        uses: actions/cache@v6
        with:
          path: ~/.cache/aia_94_leak_paper/joblib
          key: fits-${{ hashFiles('aia_94_leak_paper/eclipses/*.py') }}
          restore-keys: |
            fits-
      - name: Test with pytest
        run: pytest
      - name: Upload the article
        uses: actions/upload-artifact@v7
        with:
          name: article
          path: aia_94_leak_paper/aia-94-leak.pdf
          if-no-files-found: error
