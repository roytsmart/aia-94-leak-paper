name: ruff

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Lint
        uses: astral-sh/ruff-action@v4.1.0
      - name: Check the formatting
        uses: astral-sh/ruff-action@v4.1.0
        with:
          args: "format --check --diff"
